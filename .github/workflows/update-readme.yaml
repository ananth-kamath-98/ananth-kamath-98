# .github/workflows/update-medium.yml
name: Update README with latest Medium post

permissions:
  contents: write    # grant write access so we can push changes

on:
  workflow_dispatch:         # manual trigger in Actions UI
  push:
    branches: [ main ] 
  schedule:
    - cron: '0 * * * *' 

jobs:
  sync-medium:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true   # ensures GITHUB_TOKEN is used for pushes

      - name: Fetch latest Medium post
        id: fetch
        run: |
          FEED="https://medium.com/feed/@ananthkamath98"

          # grab only the first <item>…</item> block
          FIRST_ITEM=$(curl -s "$FEED" \
            | awk '/<item>/{flag=1} flag; /<\/item>/{print; exit}')

          # extract the title inside CDATA
          TITLE=$(echo "$FIRST_ITEM" \
            | sed -nEn 's/.*<title><!\[CDATA\[(.*)\]\]><\/title>.*/\1/p')

          # extract the link URL
          URL=$(echo "$FIRST_ITEM" \
            | sed -nEn 's/.*<link>(https?:\/\/[^<]+)<\/link>.*/\1/p')

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "url=$URL"   >> $GITHUB_OUTPUT

      - name: Update README placeholder
        run: |
          # delete old injected lines (but keep the markers)
          sed -i '/<!-- MEDIUM-START -->/,/<!-- MEDIUM-END -->/{//!d}' README.md
          # insert new markdown link after the start marker
          sed -i "/<!-- MEDIUM-START -->/a **[${{ steps.fetch.outputs.title }}](${{ steps.fetch.outputs.url }})**" README.md

      - name: Commit & push changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Action
          author_email: action@github.com
          message: update latest Medium post
          github_token: ${{ secrets.GITHUB_TOKEN }}
